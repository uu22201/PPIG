<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>🐖🐖日记</title>
<style>
:root{--bg:#fff5f7;--pink:#d995ad;--ink:#795963;--muted:#b28b98;--line:#f5dfe6;--soft:#fff4f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,sans-serif}.app{max-width:560px;margin:auto;padding:16px}.head{text-align:center;padding:14px 0 20px}.head h1{font-size:28px;color:#b8798d;margin:6px}.sub{font-size:13px;color:#c59aa8}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:16px;margin:12px 0;box-shadow:0 4px 18px #c98da00a}.who,.tabs{display:flex;gap:8px;margin-bottom:14px}.who button,.tabs button{flex:1;border:1px solid #f3dfe5;border-radius:14px;padding:11px;background:#fff8fa;color:var(--muted);font-size:13px}.active{background:#fbe5ec!important;border-color:#e8bacb!important;color:#a9677d!important;font-weight:700}.title{font-size:15px;font-weight:700;color:#a66f82;margin:0 0 12px}.emojis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.emoji{border:1px solid #f4e5e9;background:#fffbfc;border-radius:15px;padding:12px 4px;color:#987581;cursor:pointer}.emoji .face{font-size:27px;display:block;margin-bottom:5px}.emoji small{font-size:12px}.emoji.selected{background:#fbe5ec;border-color:#e4b2c3}.custom{background:#fff8fa;border:1px dashed #edcbd6;border-radius:15px;padding:12px;margin-top:12px}.custom button{width:100%;border:0;border-radius:12px;background:#f6dce5;color:#a66f82;padding:10px;margin-top:8px}input,textarea{width:100%;border:1px solid #f2dfe5;border-radius:13px;padding:11px;background:#fffbfc;font:inherit;font-size:13px;color:var(--ink);margin-top:10px;outline:none}.save{width:100%;border:0;border-radius:14px;padding:14px;background:var(--pink);color:white;font-weight:700;font-size:14px;margin-top:10px;cursor:pointer}.activities{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.activity{border:1px solid #f2dfe5;background:#fffafb;border-radius:13px;padding:11px 8px;text-align:left;color:#987581;font-size:13px;cursor:pointer}.activity.selected{background:#fbe5ec;border-color:#e4b2c3;color:#a9677d;font-weight:600}.hint{font-size:12px;color:#c39ba8;margin:0 0 10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:9px}.person{background:var(--soft);border-radius:16px;padding:14px 6px;text-align:center}.name{font-size:12px;color:var(--muted)}.big{font-size:30px;margin:8px}.mood{font-size:13px;font-weight:600;color:#a66f82}.detail{font-size:12px;color:var(--muted);margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;line-height:1.7;text-align:left}.person{min-width:0}.pair{align-items:stretch}.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.calhead button{border:0;background:#fcecf1;border-radius:10px;padding:7px 12px;color:#b8798d}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dayname{font-size:11px;color:#c39ba8;padding:5px 0}.day{min-height:42px;border:0;border-radius:10px;background:transparent;color:#987581;font-size:12px;padding:3px 0;cursor:pointer}.day.today{background:#fbe5ec}.faces{display:block;font-size:11px;min-height:13px}.hidden{display:none}.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.sticky{position:relative;min-height:118px;padding:15px 12px 12px;background:#fff5c9;border-radius:3px 3px 12px 3px;box-shadow:0 3px 9px #9c7a3a18;transform:rotate(-1deg);white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:14px;line-height:1.55}.sticky:nth-child(3n){background:#ffe3ed;transform:rotate(1.2deg)}.sticky:nth-child(3n+1){background:#e9f5df;transform:rotate(-.6deg)}.sticky .by{font-size:11px;color:#9d8188;margin-top:12px}.board textarea{min-height:82px}.board-empty{font-size:13px;color:var(--muted);text-align:center;padding:14px}.install{border:0;background:#f3dce4;color:#9b6d7c;border-radius:12px;padding:8px 12px;font-size:12px}
</style></head><body><main class="app" id="app">
<section class="panel" id="authPanel"><div class="title">🐖🐖日记 · 私人登录</div><p class="hint">邮箱登录后，和另一半一起同步记录。仅加入你们私人空间的账号可访问。</p><input id="email" type="email" autocomplete="email" placeholder="邮箱地址"><input id="password" type="password" autocomplete="current-password" placeholder="密码（至少 6 位）"><button class="save" id="loginBtn">登录</button><button class="save" id="signupBtn" style="background:#e9b9ca;color:#805b67">注册新账号</button><div class="hint" id="authMsg" style="margin-top:10px"></div></section>
<div id="diaryApp" class="hidden">
<header class="head"><h1>🐖🐖日记</h1><div class="sub" id="date"></div><button id="installBtn" class="install" style="display:none" onclick="window.__installDiary&&window.__installDiary()">添加到主屏幕</button><button id="logoutBtn" class="save" style="max-width:150px;padding:8px;margin-top:8px;background:#f3dce4;color:#9b6d7c" onclick="window.__diaryLogout&&window.__diaryLogout()">退出登录</button></header>
<section class="panel"><div class="who"><button class="active" data-person="me">🌸 小钰宝宝</button><button data-person="him">🐷 小正仆人</button></div><div class="tabs"><button class="active" data-tab="mood">今日心情</button><button data-tab="life">今日轨迹</button></div>
<div id="moodPage"><div class="title">今天的心情是？</div><div class="emojis" id="emojis"></div><div class="custom"><div class="sub">自定义专属心情</div><div style="display:flex;gap:8px"><input id="ce" placeholder="表情" maxlength="8" style="width:35%;text-align:center"><input id="cn" placeholder="心情文字" maxlength="12" style="flex:1"></div><button id="setCustom">保存自定义心情</button></div></div>
<div id="lifePage" class="hidden"><div class="title">今日轨迹</div><p class="hint">记录今天去过的地方、吃过的美食和做过的事，可以多选哦 ♡</p><div id="activities"></div><input id="other" maxlength="80" placeholder="还有其他轨迹？写在这里～"></div>
<textarea id="note" rows="2" maxlength="180" placeholder="想说的话 / 今天的小故事（选填）……"></textarea><button class="save" id="save">保存今天的记录</button></section>
<section class="panel"><div class="title">📝 便签留言板</div><p class="hint">想说什么就写下来，给彼此留一张小纸条 ♡</p><textarea id="messageText" rows="3" maxlength="500" placeholder="写一张便签吧……"></textarea><button class="save" id="postMessage">贴上便签</button><div id="messageBoard" class="board" style="margin-top:12px"></div></section>
<section class="panel"><div class="title">今天的我们</div><div class="pair"><div class="person"><div class="name">🌸 小钰宝宝</div><div class="big" id="meFace">♡</div><div class="mood" id="meMood">还没记录</div><div class="detail" id="meLife"></div></div><div class="person"><div class="name">🐷 小正仆人</div><div class="big" id="himFace">♡</div><div class="mood" id="himMood">还没记录</div><div class="detail" id="himLife"></div></div></div></section>
<section class="panel"><div class="calhead"><button id="prev">‹</button><div class="title" id="month"></div><button id="next">›</button></div><div class="days" id="calendar"></div><div class="detail" id="dayDetail"></div></section>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installBtn').style.display='inline-block'});window.__installDiary=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else{alert('iPhone：点浏览器分享按钮，选择“添加到主屏幕”。') }};
const SUPABASE_URL='https://pyniegwnhfpqozdcbrfc.supabase.co';
const SUPABASE_KEY='sb_publishable_EL48MNJDUbklx5VdhkkpAg_O0eOFgGf';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MY_UID='442d7a2a-2f66-4ad0-9401-f43a3bce5ea7';const HIM_UID='e7166740-b64d-4daa-84fc-2f07aeed20e8';
const $=id=>document.getElementById(id);let user=null,coupleId=null,currentRole='me';
const authMsg=t=>$('authMsg').textContent=t;
async function login(signup=false){let email=$('email').value.trim(),password=$('password').value;if(!email||!password){authMsg('请填写邮箱和密码');return}authMsg(signup?'正在注册…':'正在登录…');let res=signup?await sb.auth.signUp({email,password}):await sb.auth.signInWithPassword({email,password});if(res.error){authMsg(res.error.message);return}if(signup&&!res.data.session){authMsg('注册成功！请先到邮箱点击验证链接，再回来登录。');return}user=res.data.user;await initApp()}
$('loginBtn').onclick=()=>login(false);$('signupBtn').onclick=()=>login(true);
window.__diaryLogout=async()=>{await sb.auth.signOut();location.reload()};
async function initApp(){if(!user){let r=await sb.auth.getUser();user=r.data.user}if(!user)return;let m=await sb.from('diary_members').select('couple_id').eq('user_id',user.id).limit(1).maybeSingle();if(m.error){authMsg('读取私人空间失败：'+m.error.message+'。请先完成成员表安全策略设置。');return}if(!m.data){authMsg('这个账号还没有加入🐖🐖日记私人空间，请确认两个账号都已加入成员表。');return}coupleId=m.data.couple_id;currentRole=user.id===MY_UID?'me':'him';person=currentRole;document.querySelectorAll('[data-person]').forEach(b=>{b.classList.toggle('active',b.dataset.person===currentRole);b.disabled=b.dataset.person!==currentRole;b.style.opacity=b.disabled?'.55':'1'});$('authPanel').classList.add('hidden');$('diaryApp').classList.remove('hidden');authMsg('');await loadRecords();}
const moods=[['🥰','幸福'],['😊','开心'],['😌','平静'],['🥺','想念'],['😔','难过'],['😡','生气'],['😴','疲惫'],['🤗','被治愈']];
const actGroups=[['地点',[['🏠','家里'],['🏫','学校'],['💼','公司/实习'],['🍽️','餐厅/咖啡店'],['🛍️','商场/街区'],['🌳','公园/户外'],['🎬','电影院'],['🚗','出门/旅行']]],['吃了什么',[['🍜','面/粉'],['🍚','米饭/饭菜'],['🍔','汉堡/炸鸡'],['🍣','寿司/日料'],['🍲','火锅'],['🍰','甜品/蛋糕'],['🧋','奶茶/饮料'],['☕','咖啡'],['🍳','自己做的']]],['做了什么',[['📚','学习/上课'],['💼','工作/实习'],['🏃','运动/散步'],['🛍️','逛街/购物'],['🎬','看电影/追剧'],['🎮','打游戏'],['🧹','做家务'],['🛌','在家休息'],['👭','和朋友见面'],['🐷','和对方聊天'],['💕','和对方见面'],['🍳','做饭/烘焙']]]];
let now=new Date(),month=new Date(now.getFullYear(),now.getMonth(),1),person='me',chosen='',selected=[],records={},custom=null;const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=key(now);let customSaved=localStorage.getItem('ourMoodCustom');try{custom=JSON.parse(customSaved||'null')}catch{};let allMoods=[...moods];if(custom?.emoji&&custom?.label)allMoods.push([custom.emoji,custom.label]);const get=(k,p)=>records[k]?.[p];
function drawMoods(){$('emojis').innerHTML=allMoods.map(([e,n])=>`<button class="emoji ${chosen===e?'selected':''}" data-e="${e}"><span class="face">${e}</span><small>${n}</small></button>`).join('');document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{chosen=b.dataset.e;drawMoods()})}
function drawActs(){$('activities').innerHTML=actGroups.map(([group,items])=>`<div class="title" style="margin:14px 0 8px">${group}</div><div class="activities">${items.map(([e,n])=>`<button class="activity ${selected.includes(n)?'selected':''}" data-act="${n}">${e} ${n}</button>`).join('')}</div>`).join('');document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let n=b.dataset.act;selected=selected.includes(n)?selected.filter(x=>x!==n):[...selected,n];drawActs()})}
function pair(){['me','him'].forEach(p=>{let x=get(today,p);$(p+'Face').textContent=x?.emoji||'♡';$(p+'Mood').textContent=x?.label||'还没记录';$(p+'Life').textContent=[...(x?.activities||[]),x?.other,x?.note].filter(Boolean).join(' · ')})}
function calendar(){let y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();$('month').textContent=`${y}年${m+1}月`;let h=['日','一','二','三','四','五','六'].map(x=>`<div class="dayname">${x}</div>`).join('');for(let i=0;i<first;i++)h+='<div></div>';for(let d=1;d<=n;d++){let k=key(new Date(y,m,d)),a=get(k,'me'),b=get(k,'him');h+=`<button class="day ${k===today?'today':''}" data-day="${k}">${d}<span class="faces">${a?.emoji||''}${b?.emoji||''}</span></button>`}$('calendar').innerHTML=h;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{let k=b.dataset.day,a=get(k,'me'),x=get(k,'him');const fmt=(name,v)=>`${name}：${v?(v.emoji?v.emoji+' '+v.label+'；':'')+(v.activities||[]).join('、')+(v.other?'、'+v.other:'')+(v.note?'\n  '+v.note:''):'未记录'}`;$('dayDetail').textContent=`${k}\n${fmt('小钰宝宝',a)}\n${fmt('小正仆人',x)}`})}
async function loadBoard(){let r=await sb.from('diary_messages').select('*').eq('couple_id',coupleId).order('created_at',{ascending:false}).limit(100);if(r.error){$('messageBoard').innerHTML='<div class="board-empty">留言板还没准备好，请先执行配套 SQL 设置 ♡</div>';return}let names={[MY_UID]:'🌸 小钰宝宝',[HIM_UID]:'🐷 小正仆人'};$('messageBoard').innerHTML=(r.data||[]).map(x=>`<article class="sticky"><div>${escapeHtml(x.content)}</div><div class="by">${names[x.user_id]||'我们'} · ${new Date(x.created_at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</div></article>`).join('')||'<div class="board-empty">还没有便签，写下第一张吧 ♡</div>'}
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function notifyPartner(kind,preview){try{await sb.functions.invoke('send-diary-notification',{body:{couple_id:coupleId,actor_user_id:user.id,kind,preview}})}catch(e){console.warn('邮件提醒服务尚未配置',e)}}
async function loadRecords(){let r=await sb.from('diary_entries').select('*').eq('couple_id',coupleId).order('entry_date');if(r.error){alert('读取日记失败：'+r.error.message);return}records={};for(let row of r.data||[]){let p=row.user_id===MY_UID?'me':'him';records[row.entry_date]=records[row.entry_date]||{};records[row.entry_date][p]={emoji:row.mood||'',label:allMoods.find(x=>x[0]===row.mood)?.[1]||(custom?.emoji===row.mood?custom.label:'')||row.activities?.customMoodLabel||'',activities:row.activities?.selected||[],other:row.activities?.other||'',note:row.note||'',dbid:row.id}}pair();calendar();await loadBoard();}
document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{if(b.dataset.person!==currentRole)return;person=currentRole;document.querySelectorAll('[data-person]').forEach(x=>x.classList.toggle('active',x===b));let x=get(today,person);chosen=x?.emoji||'';selected=x?.activities||[];$('note').value=x?.note||'';$('other').value=x?.other||'';drawMoods();drawActs()});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('moodPage').classList.toggle('hidden',b.dataset.tab!=='mood');$('lifePage').classList.toggle('hidden',b.dataset.tab!=='life')});
$('setCustom').onclick=()=>{let e=$('ce').value.trim(),n=$('cn').value.trim();if(!e||!n){alert('请填写表情和心情文字哦');return}if(custom)allMoods=allMoods.filter(x=>x[0]!==custom.emoji);custom={emoji:e,label:n};allMoods.push([e,n]);localStorage.setItem('ourMoodCustom',JSON.stringify(custom));chosen=e;drawMoods()};
$('save').onclick=async()=>{person=currentRole;let m=allMoods.find(x=>x[0]===chosen),entry={couple_id:coupleId,user_id:user.id,entry_date:today,mood:chosen||null,activities:{selected,other:$('other').value.trim(),customMoodLabel:m?.[1]||''},note:$('note').value.trim(),updated_at:new Date().toISOString()};let existing=get(today,person);let q=existing?.dbid?sb.from('diary_entries').update(entry).eq('id',existing.dbid):sb.from('diary_entries').insert(entry);let r=await q.select().single();if(r.error){alert('保存失败：'+r.error.message);return}await loadRecords();$('dayDetail').textContent='今天的记录已同步保存 ♡';await notifyPartner('entry','今天更新了日记，快来看看吧 ♡')};
$('postMessage').onclick=async()=>{let content=$('messageText').value.trim();if(!content){alert('先写点想说的话吧 ♡');return}let r=await sb.from('diary_messages').insert({couple_id:coupleId,user_id:user.id,content}).select().single();if(r.error){alert('留言暂时没能保存：'+r.error.message+'。请确认已执行留言板 SQL。');return}$('messageText').value='';await loadBoard();await notifyPartner('message',content.slice(0,120))};
$('prev').onclick=()=>{month.setMonth(month.getMonth()-1);calendar()};$('next').onclick=()=>{month.setMonth(month.getMonth()+1);calendar()};drawMoods();drawActs();
sb.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;initApp()}});
})();
</script></body></html>
